# Databricks job: bronze → silver → gold
resources:
  jobs:
    taco_bueno_daily:
      name: taco_bueno_daily
      max_concurrent_runs: 1
      tasks:
        - task_key: extract_csv
          notebook_task:
            notebook_path: src/transformations/bronze/extract_csv.py
        - task_key: bronze_ventas
          depends_on:
            - task_key: extract_csv
          notebook_task:
            notebook_path: src/transformations/bronze/st_ventas_bronze.py
        - task_key: silver_unidades
          depends_on:
            - task_key: bronze_ventas
          notebook_task:
            notebook_path: src/transformations/silver/st_ventas_unidades.py
        - task_key: silver_wait_time
          depends_on:
            - task_key: silver_unidades
          notebook_task:
            notebook_path: src/transformations/silver/st_tiempo_espera.py
        - task_key: optimize
          depends_on:
            - task_key: silver_wait_time
          notebook_task:
            notebook_path: src/transformations/silver/optimize_ventas.sql
        - task_key: gold_daily_store
          depends_on:
            - task_key: optimize
          notebook_task:
            notebook_path: src/transformations/gold/st_daily_store_kpis.py
        - task_key: gold_executive_kpis
          depends_on:
            - task_key: gold_daily_store
          notebook_task:
            notebook_path: src/transformations/gold/mv_executive_kpis.sql
